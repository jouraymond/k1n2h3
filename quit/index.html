<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>戒菸與跑步 · joechou</title>
<meta name="description" content="從 2026 年 8 月 18 日早上 7 點開始，一支菸都沒碰。這裡記錄戒菸的時間，以及同一段日子裡跑了多少。">
<meta property="og:title" content="戒菸與跑步">
<meta property="og:description" content="戒了多久，跑了多遠。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>🏃</text></svg>">

<style>
/* ------------------------------------------------------------------
   單一深色主題，刻意的選擇：沿用 k1n2h3 既有頁面的視覺。
   所有顏色都明確指定，不依賴瀏覽器預設。
   資料顏色（--series-*）經過色盲可辨識度驗證，不要隨手改。
------------------------------------------------------------------ */
:root {
  color-scheme: dark;

  --bg:            #0E0E10;
  --surface:       #17171A;
  --surface-2:     #1E1E22;
  --line:          #2A2A30;
  --line-soft:     #212126;

  --text:          #EDEDEE;
  --text-2:        #9A9AA0;
  --text-3:        #6B6B72;

  --brand:         #FFB23E;   /* 品牌色：標題與大數字。不當資料色使用。 */
  --brand-dim:     #4A3413;

  --series-1:      #3987e5;   /* 戒菸前 */
  --series-2:      #c98500;   /* 戒菸後 */
  --good:          #199e70;

  /* 心率區間是有序的強度，所以用單一色相、明度遞增的序列色階，
     不是七個各自為政的顏色。越亮＝越吃力。 */
  --z1: #4d4230;  --z2: #6b5730;  --z3: #8c6c2b;
  --z4: #ae8324;  --z5: #cf9c1f;  --z6: #eeb63a;  --z7: #ffd68a;

  --radius: 12px;
  --mono: "SF Mono", "JetBrains Mono", "Cascadia Mono", Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC",
          "Microsoft JhengHei", "Noto Sans TC", sans-serif;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
}

.wrap {
  max-width: 860px;
  margin: 0 auto;
  padding: 40px 20px 80px;
  display: flex;
  flex-direction: column;
  gap: 34px;
}

/* ---------- 通用 ---------- */
.eyebrow {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--text-3);
  margin: 0;
}
h1 { font-size: 26px; font-weight: 700; letter-spacing: -.02em; margin: 6px 0 0; }
h2 {
  font-size: 17px; font-weight: 600; letter-spacing: -.01em;
  margin: 0; display: flex; align-items: baseline; gap: 10px;
}
h2 .sub { font-size: 12.5px; font-weight: 400; color: var(--text-2); letter-spacing: 0; }

section { display: flex; flex-direction: column; gap: 14px; }
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 20px;
}
.tnum { font-variant-numeric: tabular-nums; }

/* ---------- 戒菸計時 ---------- */
.hero {
  background: linear-gradient(180deg, #1C1710 0%, var(--surface) 62%);
  border: 1px solid var(--brand-dim);
  border-radius: var(--radius);
  padding: 30px 24px 26px;
  text-align: center;
}
.hero .label { font-size: 12.5px; color: var(--text-2); margin: 0 0 14px; }
.clock { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; }
.unit { min-width: 72px; }
.unit .n {
  font-family: var(--mono);
  font-size: clamp(30px, 8vw, 46px);
  font-weight: 600;
  line-height: 1.05;
  color: var(--brand);
  font-variant-numeric: tabular-nums;
}
.unit .u { font-size: 11px; color: var(--text-3); letter-spacing: .1em; }
.hero .since { margin: 16px 0 0; font-size: 12.5px; color: var(--text-3); }

/* ---------- 數字磚 ---------- */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; }
.tile .k { font-size: 12px; color: var(--text-2); margin: 0 0 8px; }
.tile .v { font-family: var(--mono); font-size: 27px; font-weight: 600; line-height: 1.15; font-variant-numeric: tabular-nums; }
.tile .v small { font-size: 14px; font-weight: 400; color: var(--text-2); margin-left: 3px; }
.tile .note { font-size: 12px; color: var(--text-3); margin: 7px 0 0; line-height: 1.55; }

/* ---------- 圖表 ---------- */
figure { margin: 0; }
figcaption { font-size: 12.5px; color: var(--text-2); margin: 0 0 14px; line-height: 1.6; }
.chart-scroll { overflow-x: auto; }
svg { display: block; max-width: 100%; }
svg text { font-family: var(--sans); fill: var(--text-2); }
.axis-line { stroke: var(--line); stroke-width: 1; }
.grid-line { stroke: var(--line-soft); stroke-width: 1; }
.tick { font-size: 10.5px; fill: var(--text-3); }
.mark { transition: opacity .12s; }
.chart:hover .mark { opacity: .45; }
.chart .mark:hover, .chart .mark.on { opacity: 1; }

.legend { display: flex; flex-wrap: wrap; gap: 16px; margin: 0 0 12px; font-size: 12.5px; color: var(--text-2); }
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.swatch { width: 11px; height: 11px; border-radius: 3px; flex: none; }

.tip {
  position: fixed; z-index: 20; pointer-events: none;
  background: var(--surface-2); border: 1px solid var(--line);
  border-radius: 8px; padding: 9px 11px;
  font-size: 12.5px; line-height: 1.55; color: var(--text);
  box-shadow: 0 8px 24px rgba(0,0,0,.5);
  opacity: 0; transition: opacity .1s;
  max-width: 240px;
}
.tip.show { opacity: 1; }
.tip b { color: var(--brand); font-weight: 600; }
.tip .row { display: flex; justify-content: space-between; gap: 14px; font-family: var(--mono); font-size: 11.5px; }
.tip .row span:first-child { color: var(--text-2); font-family: var(--sans); }

/* ---------- 徽章 ---------- */
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(228px, 1fr)); gap: 12px; }
.badge {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 15px 17px;
  display: flex; flex-direction: column; gap: 6px;
}
.badge.done { border-color: var(--brand-dim); background: linear-gradient(180deg, #1B1610, var(--surface) 70%); }
.badge .top { display: flex; align-items: center; gap: 9px; }
.badge .ico { font-size: 17px; line-height: 1; filter: grayscale(1) opacity(.35); }
.badge.done .ico { filter: none; }
.badge .name { font-size: 14px; font-weight: 600; }
.badge.done .name { color: var(--brand); }
.badge .why { font-size: 12px; color: var(--text-2); line-height: 1.6; }
.badge .when { font-family: var(--mono); font-size: 11px; color: var(--text-3); }
.bar { height: 4px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--series-1); border-radius: 99px; }
.group-title { font-size: 12px; color: var(--text-3); font-family: var(--mono); letter-spacing: .1em; text-transform: uppercase; margin: 6px 0 -4px; }

/* ---------- 活動清單 ---------- */
.runs { display: flex; flex-direction: column; gap: 8px; }
.run {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 14px 16px;
  display: flex; flex-direction: column; gap: 10px;
}
.run.after { border-left: 3px solid var(--series-2); }
.run.before { border-left: 3px solid var(--series-1); }
.run .line1 { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.run .date { font-family: var(--mono); font-size: 12px; color: var(--text-3); min-width: 92px; }
.run .dist { font-family: var(--mono); font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
.run .facts { display: flex; gap: 14px; flex-wrap: wrap; font-family: var(--mono); font-size: 12.5px; color: var(--text-2); font-variant-numeric: tabular-nums; }
.run .facts b { color: var(--text); font-weight: 500; }
.zbar { display: flex; height: 9px; border-radius: 99px; overflow: hidden; gap: 2px; background: transparent; }
.zbar > i { display: block; height: 100%; }
.zbar > i:first-child { border-radius: 99px 0 0 99px; }
.zbar > i:last-child { border-radius: 0 99px 99px 0; }
.zlegend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 11.5px; color: var(--text-2); margin: 0 0 12px; }
.zlegend span { display: inline-flex; align-items: center; gap: 6px; }

.run.has-detail { cursor: pointer; }
.run.has-detail:hover { border-color: #3A3A42; }
.run .chev { margin-left: auto; color: var(--text-3); font-size: 11px; font-family: var(--mono); }
.detail { border-top: 1px solid var(--line); padding-top: 14px; display: flex; flex-direction: column; gap: 16px; }
.splits { width: 100%; border-collapse: collapse; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.splits th { font-family: var(--mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase;
             color: var(--text-3); font-weight: 500; text-align: right; padding: 0 0 7px; }
.splits th:first-child, .splits td:first-child { text-align: left; }
.splits td { padding: 4px 0; text-align: right; color: var(--text-2); font-family: var(--mono); }
.splits td.km { color: var(--text); }
.splits td.p { color: var(--text); }
.splits .track { width: 46%; padding-left: 14px; }
.splits .track > i { display: block; height: 7px; border-radius: 99px; background: var(--series-2); }
.splits tr.fastest td.p { color: var(--brand); font-weight: 600; }
.detail h4 { margin: 0 0 8px; font-size: 12px; color: var(--text-3); font-family: var(--mono);
             letter-spacing: .08em; text-transform: uppercase; font-weight: 500; }

footer { border-top: 1px solid var(--line); padding-top: 18px; font-size: 12px; color: var(--text-3); line-height: 1.7; }
footer a { color: var(--text-2); }

.state { padding: 28px; text-align: center; color: var(--text-2); font-size: 13.5px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div class="wrap">

  <header>
    <p class="eyebrow">jouraymond / k1n2h3</p>
    <h1>戒菸與跑步</h1>
  </header>

  <div id="app"><div class="state">載入中…</div></div>

  <footer>
    跑步資料由 Garmin 手錶經 intervals.icu 自動同步，每 30 分鐘更新一次。
    2025 年 9 月之前的生涯里程取自<a href="https://www.marathonsworld.com" target="_blank" rel="noopener">馬拉松世界</a>的累計紀錄。
    <span id="updated"></span>
  </footer>

</div>

<div class="tip" id="tip"></div>

<script type="module">
/* ==================================================================
   設定。anon key 是設計上可公開的：資料庫端的權限規則只開放
   public_runs / public_profile 兩個唯讀視圖，原始表完全鎖住。
================================================================== */
const SUPABASE_URL = "https://rcpbqnqcdeaednwevbur.supabase.co";
const ANON_KEY = "sb_publishable_6jrxZaaK6SFnI_TWgbRlyQ_CnTJg1XP";

const api = async (path) => {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    headers: { apikey: ANON_KEY, Authorization: `Bearer ${ANON_KEY}` },
  });
  if (!r.ok) throw new Error(`${r.status} ${await r.text()}`);
  return r.json();
};

/* ---------------------------------------------------------------- 工具 */
const KM = (m) => m / 1000;
const n1 = (x) => x.toFixed(1);
const pace = (s) => {
  if (!s || !isFinite(s)) return "—";
  const m = Math.floor(s / 60), sec = Math.round(s % 60);
  return `${m}:${String(sec).padStart(2, "0")}`;
};
const hms = (s) => {
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
  return h ? `${h} 小時 ${m} 分` : `${m} 分`;
};
const el = (html) => {
  const t = document.createElement("template");
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
};
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// 注意：這支腳本用了頂層 await，await 之後才宣告的 const 在渲染時還沒初始化。
// 常數一律放在 await 之前，函式才可以放後面（函式宣告會被提升）。
const ZONE_NAME = ["Z1 恢復", "Z2 有氧", "Z3 節奏", "Z4 閾值", "Z5 無氧", "Z6 最大", "Z7"];

/* ---------------------------------------------------------------- 提示框 */
const tipEl = document.getElementById("tip");
function bindTip(node, html) {
  const show = (e) => {
    tipEl.innerHTML = html;
    tipEl.classList.add("show");
    const pad = 14, w = tipEl.offsetWidth, h = tipEl.offsetHeight;
    let x = e.clientX + pad, y = e.clientY - h - pad;
    if (x + w > innerWidth - 8) x = e.clientX - w - pad;
    if (y < 8) y = e.clientY + pad;
    tipEl.style.left = x + "px";
    tipEl.style.top = y + "px";
  };
  node.addEventListener("pointerenter", show);
  node.addEventListener("pointermove", show);
  node.addEventListener("pointerleave", () => tipEl.classList.remove("show"));
}

/* ---------------------------------------------------------------- 主流程 */
try {
  const [profileRows, runs] = await Promise.all([
    api("public_profile?select=*"),
    api("public_runs?select=*&order=start_local.asc&limit=5000"),
  ]);
  if (!profileRows.length) throw new Error("找不到公開的個人資料");
  render(profileRows[0], runs.map((r) => ({
    ...r,
    distance_m: +r.distance_m,
    moving_time_s: +r.moving_time_s,
    pace_s_per_km: r.pace_s_per_km == null ? null : +r.pace_s_per_km,
    t: new Date(r.start_local),
  })));
} catch (err) {
  document.getElementById("app").innerHTML =
    `<div class="card state">讀不到資料。<br><span style="font-family:var(--mono);font-size:11.5px">${esc(err.message)}</span></div>`;
}

/* ================================================================== */
function render(profile, runs) {
  const quit = new Date(profile.quit_date);
  const baselineKm = KM(+profile.baseline_distance_m || 0);

  const after = runs.filter((r) => r.t >= quit);
  const trackedKm = KM(runs.reduce((s, r) => s + r.distance_m, 0));
  const afterKm = KM(after.reduce((s, r) => s + r.distance_m, 0));
  const lifetimeKm = baselineKm + trackedKm;

  const app = document.getElementById("app");
  app.innerHTML = "";
  app.append(
    heroClock(quit),
    tiles({ lifetimeKm, baselineKm, trackedKm, afterKm, after, profile }),
    comparison(runs, quit),
    monthlyChart(runs, quit),
    paceChart(runs, quit),
    recentRuns(runs, quit),
    badges({ quit, lifetimeKm, afterKm, after, runs }),
  );

  const last = runs[runs.length - 1];
  document.getElementById("updated").textContent =
    last ? `最後一筆活動：${last.day}。` : "";
}

/* ---------------------------------------------------------------- 戒菸計時 */
function heroClock(quit) {
  const node = el(`
    <div class="hero">
      <p class="label">自 2026 年 8 月 18 日早上 7 點起，一支菸都沒碰</p>
      <div class="clock">
        <div class="unit"><div class="n" data-u="d">—</div><div class="u">天</div></div>
        <div class="unit"><div class="n" data-u="h">—</div><div class="u">時</div></div>
        <div class="unit"><div class="n" data-u="m">—</div><div class="u">分</div></div>
        <div class="unit"><div class="n" data-u="s">—</div><div class="u">秒</div></div>
      </div>
      <p class="since"></p>
    </div>`);

  const f = Object.fromEntries(
    [...node.querySelectorAll("[data-u]")].map((n) => [n.dataset.u, n]));
  const since = node.querySelector(".since");

  const tick = () => {
    let d = Math.max(0, (Date.now() - quit.getTime()) / 1000);
    const days = Math.floor(d / 86400); d -= days * 86400;
    const hrs = Math.floor(d / 3600);   d -= hrs * 3600;
    const min = Math.floor(d / 60);
    const sec = Math.floor(d - min * 60);
    f.d.textContent = days;
    f.h.textContent = String(hrs).padStart(2, "0");
    f.m.textContent = String(min).padStart(2, "0");
    f.s.textContent = String(sec).padStart(2, "0");
    const next = [7, 14, 30, 90, 182, 365, 730].find((t) => t > days);
    since.textContent = next
      ? `距離滿 ${next} 天還有 ${next - days} 天`
      : "已經數不清多少天了";
  };
  tick();
  setInterval(tick, 1000);
  return node;
}

/* ---------------------------------------------------------------- 數字磚 */
function tiles({ lifetimeKm, baselineKm, trackedKm, afterKm, after }) {
  const avgPace = after.length
    ? after.reduce((s, r) => s + r.moving_time_s, 0) /
      (after.reduce((s, r) => s + r.distance_m, 0) / 1000)
    : null;
  const longest = after.reduce((a, r) => (r.distance_m > (a?.distance_m ?? 0) ? r : a), null);

  const wrap = el('<div class="tiles"></div>');
  wrap.append(
    el(`<div class="tile">
          <p class="k">生涯總里程</p>
          <div class="v tnum">${n1(lifetimeKm)}<small>km</small></div>
          <p class="note">2025 年 9 月前累計 ${n1(baselineKm)}，之後逐筆記錄 ${n1(trackedKm)}。</p>
        </div>`),
    el(`<div class="tile">
          <p class="k">戒菸後跑量</p>
          <div class="v tnum" style="color:var(--series-2)">${n1(afterKm)}<small>km</small></div>
          <p class="note">${after.length} 趟，佔生涯里程的 ${((afterKm / lifetimeKm) * 100).toFixed(1)}%。</p>
        </div>`),
    el(`<div class="tile">
          <p class="k">戒菸後平均配速</p>
          <div class="v tnum">${pace(avgPace)}<small>/km</small></div>
          <p class="note">${longest ? `最長一趟 ${n1(KM(longest.distance_m))} km（${longest.day}）。` : "尚無資料。"}</p>
        </div>`),
  );
  return wrap;
}

/* ---------------------------------------------------------------- 前後對照 */
function comparison(runs, quit) {
  const days = Math.max(1, Math.ceil((Date.now() - quit.getTime()) / 86400000));
  const prevStart = new Date(quit.getTime() - days * 86400000);
  const before = runs.filter((r) => r.t >= prevStart && r.t < quit);
  const after = runs.filter((r) => r.t >= quit);

  const sum = (a) => KM(a.reduce((s, r) => s + r.distance_m, 0));
  const bKm = sum(before), aKm = sum(after);
  const max = Math.max(bKm, aKm, 1);

  const W = 520, rowH = 46, H = rowH * 2 + 10;
  const labelW = 128, barW = W - labelW - 60;

  const bar = (i, label, km, cnt, color) => {
    const y = i * rowH + 8;
    const w = Math.max(2, (km / max) * barW);
    return `<g class="mark" data-i="${i}">
      <text x="0" y="${y + 20}" font-size="12.5" fill="var(--text-2)">${label}</text>
      <rect x="${labelW}" y="${y + 6}" width="${w}" height="22" rx="4" fill="${color}"></rect>
      <text x="${labelW + w + 9}" y="${y + 22}" font-size="12.5" fill="var(--text)"
            font-family="var(--mono)">${n1(km)} km</text>
      <rect x="0" y="${y}" width="${W}" height="${rowH - 6}" fill="transparent"></rect>
    </g>`;
  };

  const node = el(`
    <section>
      <h2>戒菸前後的同期對照 <span class="sub">各取 ${days} 天</span></h2>
      <div class="card">
        <figure>
          <figcaption>把戒菸之後這 ${days} 天，跟緊接在戒菸之前、一樣長的 ${days} 天放在一起比。
            同樣的天數、同一個人、同一副身體，唯一的差別是有沒有菸。</figcaption>
          <div class="chart-scroll">
            <svg class="chart" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img"
                 aria-label="戒菸前後同期跑量對照">
              ${bar(0, `戒菸前 ${days} 天`, bKm, before.length, "var(--series-1)")}
              ${bar(1, `戒菸後 ${days} 天`, aKm, after.length, "var(--series-2)")}
            </svg>
          </div>
        </figure>
      </div>
    </section>`);

  const meta = [
    { label: "戒菸前", km: bKm, runs: before },
    { label: "戒菸後", km: aKm, runs: after },
  ];
  node.querySelectorAll(".mark").forEach((g, i) => {
    const m = meta[i];
    const p = m.km && m.runs.length
      ? m.runs.reduce((s, r) => s + r.moving_time_s, 0) / (m.km)
      : null;
    bindTip(g, `<b>${m.label} ${days} 天</b>
      <div class="row"><span>里程</span><span>${n1(m.km)} km</span></div>
      <div class="row"><span>次數</span><span>${m.runs.length} 趟</span></div>
      <div class="row"><span>平均配速</span><span>${pace(p)}/km</span></div>`);
  });
  return node;
}

/* ---------------------------------------------------------------- 月跑量 */
function monthlyChart(runs, quit) {
  // 戒菸當月同時含戒菸前與戒菸後的活動，所以逐筆分流，
  // 那個月會畫成上下兩段，而不是整根染成同一色。
  const by = new Map();
  runs.forEach((r) => {
    const k = r.day.slice(0, 7);
    const v = by.get(k) || { km: 0, n: 0, sec: 0, before: 0, after: 0 };
    const km = KM(r.distance_m);
    v.km += km; v.n++; v.sec += r.moving_time_s;
    (r.t >= quit ? (v.after += km) : (v.before += km));
    by.set(k, v);
  });
  const months = [...by.keys()].sort();
  const quitKey = `${quit.getFullYear()}-${String(quit.getMonth() + 1).padStart(2, "0")}`;

  const W = Math.max(560, months.length * 46), H = 250;
  const padL = 40, padR = 12, padB = 34, padT = 14;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const max = Math.max(...months.map((m) => by.get(m).km), 10);
  const niceMax = Math.ceil(max / 20) * 20;
  const bw = Math.min(30, (plotW / months.length) - 10);

  const x = (i) => padL + (plotW / months.length) * (i + 0.5);
  const y = (v) => padT + plotH - (v / niceMax) * plotH;

  let grid = "", bars = "";
  for (let g = 0; g <= 4; g++) {
    const v = (niceMax / 4) * g;
    grid += `<line class="grid-line" x1="${padL}" x2="${W - padR}" y1="${y(v)}" y2="${y(v)}"></line>
             <text class="tick" x="${padL - 7}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  }
  const base = padT + plotH;
  months.forEach((m, i) => {
    const d = by.get(m);
    const left = x(i) - bw / 2;
    const hOf = (km) => (km / niceMax) * plotH;
    let seg = "";
    if (d.before > 0 && d.after > 0) {
      // 兩段之間留 2px 的底色縫，讓分界看得出來而不是黏成一塊
      const hb = Math.max(2, hOf(d.before)), ha = Math.max(2, hOf(d.after));
      seg =
        `<rect x="${left}" y="${base - hb}" width="${bw}" height="${hb}" rx="4"
               fill="var(--series-1)"></rect>` +
        `<rect x="${left}" y="${base - hb - 2 - ha}" width="${bw}" height="${ha}" rx="4"
               fill="var(--series-2)"></rect>`;
    } else {
      const h = Math.max(2, hOf(d.km));
      seg = `<rect x="${left}" y="${base - h}" width="${bw}" height="${h}" rx="4"
                   fill="${d.after > 0 ? "var(--series-2)" : "var(--series-1)"}"></rect>`;
    }
    bars += `<g class="mark">${seg}
      <rect x="${x(i) - (plotW / months.length) / 2}" y="${padT}"
            width="${plotW / months.length}" height="${plotH}" fill="transparent"></rect>
    </g>`;
  });
  const labels = months.map((m, i) =>
    `<text class="tick" x="${x(i)}" y="${H - padB + 18}" text-anchor="middle">${m.slice(5)}</text>`
  ).join("");
  const yearMarks = months.map((m, i) =>
    m.slice(5) === "01" || i === 0
      ? `<text class="tick" x="${x(i)}" y="${H - padB + 31}" text-anchor="middle" fill="var(--text-3)">${m.slice(0, 4)}</text>`
      : ""
  ).join("");

  // 戒菸月的分界線
  const qi = months.indexOf(quitKey);
  const qLine = qi >= 0
    ? `<line x1="${x(qi) - (plotW / months.length) / 2}" x2="${x(qi) - (plotW / months.length) / 2}"
             y1="${padT}" y2="${padT + plotH}" stroke="var(--brand)" stroke-width="1.5"
             stroke-dasharray="4 3"></line>
       <text x="${x(qi) - (plotW / months.length) / 2 + 6}" y="${padT + 12}" font-size="11"
             fill="var(--brand)">戒菸</text>`
    : "";

  const node = el(`
    <section>
      <h2>每月跑量 <span class="sub">公里</span></h2>
      <div class="card">
        <figure>
          <div class="legend">
            <span><i class="swatch" style="background:var(--series-1)"></i>戒菸前</span>
            <span><i class="swatch" style="background:var(--series-2)"></i>戒菸後</span>
          </div>
          <div class="chart-scroll">
            <svg class="chart" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img"
                 aria-label="每月跑量長條圖">
              ${grid}${qLine}${bars}
              <line class="axis-line" x1="${padL}" x2="${W - padR}" y1="${padT + plotH}" y2="${padT + plotH}"></line>
              ${labels}${yearMarks}
            </svg>
          </div>
        </figure>
      </div>
    </section>`);

  node.querySelectorAll(".mark").forEach((g, i) => {
    const m = months[i], d = by.get(m);
    const split = d.before > 0 && d.after > 0
      ? `<div class="row"><span>戒菸前</span><span>${n1(d.before)} km</span></div>
         <div class="row"><span>戒菸後</span><span>${n1(d.after)} km</span></div>` : "";
    bindTip(g, `<b>${m}</b>
      <div class="row"><span>里程</span><span>${n1(d.km)} km</span></div>
      ${split}
      <div class="row"><span>次數</span><span>${d.n} 趟</span></div>
      <div class="row"><span>時間</span><span>${hms(d.sec)}</span></div>
      <div class="row"><span>平均配速</span><span>${pace(d.sec / d.km)}/km</span></div>`);
  });
  return node;
}

/* ---------------------------------------------------------------- 配速 */
function paceChart(runs, quit) {
  const pts = runs.filter((r) => r.pace_s_per_km && r.distance_m >= 2000);
  if (pts.length < 3) return el("<section></section>");

  const W = 640, H = 240, padL = 44, padR = 14, padT = 14, padB = 30;
  const plotW = W - padL - padR, plotH = H - padT - padB;

  const t0 = pts[0].t.getTime(), t1 = pts[pts.length - 1].t.getTime();
  const paces = pts.map((p) => p.pace_s_per_km);
  const lo = Math.floor(Math.min(...paces) / 30) * 30 - 30;
  const hi = Math.ceil(Math.max(...paces) / 30) * 30 + 30;

  const x = (t) => padL + ((t - t0) / Math.max(1, t1 - t0)) * plotW;
  // 配速越小越快，所以 y 軸反過來畫：快的在上面
  const y = (p) => padT + ((p - lo) / (hi - lo)) * plotH;

  let grid = "";
  for (let v = lo; v <= hi; v += 30) {
    grid += `<line class="grid-line" x1="${padL}" x2="${W - padR}" y1="${y(v)}" y2="${y(v)}"></line>
             <text class="tick" x="${padL - 7}" y="${y(v) + 4}" text-anchor="end">${pace(v)}</text>`;
  }

  const dots = pts.map((p) => {
    const isAfter = p.t >= quit;
    const r = Math.max(4, Math.min(9, Math.sqrt(KM(p.distance_m)) * 2.1));
    return `<circle class="mark" cx="${x(p.t.getTime())}" cy="${y(p.pace_s_per_km)}" r="${r}"
              fill="${isAfter ? "var(--series-2)" : "var(--series-1)"}"
              stroke="var(--surface)" stroke-width="2"></circle>`;
  }).join("");

  const qx = x(quit.getTime());
  const qLine = qx > padL && qx < W - padR
    ? `<line x1="${qx}" x2="${qx}" y1="${padT}" y2="${padT + plotH}" stroke="var(--brand)"
             stroke-width="1.5" stroke-dasharray="4 3"></line>
       <text x="${qx - 6}" y="${padT + 12}" font-size="11" fill="var(--brand)" text-anchor="end">戒菸</text>`
    : "";

  const node = el(`
    <section>
      <h2>每趟配速 <span class="sub">圓點越大代表距離越長</span></h2>
      <div class="card">
        <figure>
          <figcaption>縱軸往上是越快。只計入 2 公里以上的活動，短程熱身會把趨勢拉歪。</figcaption>
          <div class="chart-scroll">
            <svg class="chart" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img"
                 aria-label="每趟跑步配速散布圖">
              ${grid}${qLine}${dots}
              <line class="axis-line" x1="${padL}" x2="${W - padR}" y1="${padT + plotH}" y2="${padT + plotH}"></line>
            </svg>
          </div>
        </figure>
      </div>
    </section>`);

  node.querySelectorAll(".mark").forEach((c, i) => {
    const p = pts[i];
    bindTip(c, `<b>${p.day}</b>
      <div class="row"><span>距離</span><span>${n1(KM(p.distance_m))} km</span></div>
      <div class="row"><span>配速</span><span>${pace(p.pace_s_per_km)}/km</span></div>
      <div class="row"><span>時間</span><span>${hms(p.moving_time_s)}</span></div>
      ${p.avg_hr ? `<div class="row"><span>平均心率</span><span>${Math.round(p.avg_hr)} bpm</span></div>` : ""}`);
  });
  return node;
}

/* ---------------------------------------------------------------- 活動清單 */
function zoneBar(secs) {
  const total = secs.reduce((a, b) => a + b, 0);
  if (!total) return "";
  return `<div class="zbar">${secs.map((s, i) =>
    s > 0 ? `<i style="width:${(s / total) * 100}%;background:var(--z${i + 1})"></i>` : ""
  ).join("")}</div>`;
}

function recentRuns(runs, quit) {
  const list = [...runs].reverse().slice(0, 12);
  const node = el(`
    <section>
      <h2>最近的活動 <span class="sub">最新 ${list.length} 趟</span></h2>
      <div class="zlegend">
        ${ZONE_NAME.slice(0, 6).map((n, i) =>
          `<span><i class="swatch" style="background:var(--z${i + 1})"></i>${n}</span>`).join("")}
      </div>
      <div class="runs"></div>
    </section>`);
  const box = node.querySelector(".runs");

  list.forEach((r) => {
    const secs = (r.hr_zone_secs || []).map(Number);
    const bounds = (r.hr_zone_bounds || []).map(Number);
    const isAfter = r.t >= quit;
    const item = el(`
      <div class="run ${isAfter ? "after" : "before"}">
        <div class="line1">
          <span class="date">${r.day}</span>
          <span class="dist">${n1(KM(r.distance_m))} km</span>
          <span class="facts">
            <span>${hms(r.moving_time_s)}</span>
            <span><b>${pace(r.pace_s_per_km)}</b>/km</span>
            ${r.avg_hr ? `<span>心率 <b>${Math.round(r.avg_hr)}</b> / ${Math.round(r.max_hr)}</span>` : ""}
            ${r.avg_cadence ? `<span>步頻 <b>${Math.round(r.avg_cadence * 2)}</b></span>` : ""}
            ${r.elev_gain_m ? `<span>爬升 ${Math.round(r.elev_gain_m)} m</span>` : ""}
          </span>
        </div>
        ${zoneBar(secs)}
      </div>`);

    const splits = r.splits || [];
    if (splits.length) {
      item.classList.add("has-detail");
      item.querySelector(".line1").append(el('<span class="chev">展開 ▾</span>'));
      const chev = item.querySelector(".chev");
      let open = false, panel = null;
      item.addEventListener("click", (e) => {
        if (e.target.closest(".zbar")) return;   // 心率條上有自己的提示，別誤觸
        open = !open;
        chev.textContent = open ? "收合 ▴" : "展開 ▾";
        if (open) { panel = runDetail(r, splits); item.append(panel); }
        else if (panel) { panel.remove(); panel = null; }
      });
    }

    const bar = item.querySelector(".zbar");
    if (bar) {
      const total = secs.reduce((a, b) => a + b, 0);
      bindTip(bar, `<b>${r.day} 心率區間</b>` + secs.map((s, i) =>
        s > 0
          ? `<div class="row"><span>${ZONE_NAME[i]}${bounds[i] ? ` · ${bounds[i]}+` : ""}</span>
             <span>${Math.round(s / 60)} 分（${Math.round((s / total) * 100)}%）</span></div>`
          : "").join(""));
    }
    box.append(item);
  });
  return node;
}

/* ---------------------------------------------------------------- 單趟細節 */
function runDetail(r, splits) {
  const paces = splits.map((s) => s.pace_s_per_km).filter(Boolean);
  const fast = Math.min(...paces), slow = Math.max(...paces);
  // 長條長度用「相對於最慢那段」來畫，差異才看得出來；
  // 從 0 起算的話每段都快滿格，等於沒畫。
  const width = (p) => 12 + 88 * ((slow - p) / Math.max(1, slow - fast));

  const rows = splits.map((s) => {
    const label = s.km ? `${s.km}` : `${Math.round(s.partial_m)} m`;
    const isFast = s.pace_s_per_km === fast && s.km;
    return `<tr class="${isFast ? "fastest" : ""}">
      <td class="km">${label}</td>
      <td class="p">${pace(s.pace_s_per_km)}</td>
      <td>${s.avg_hr ?? "—"}</td>
      <td>${s.elev_gain_m ? `+${Math.round(s.elev_gain_m)}` : "—"}</td>
      <td class="track"><i style="width:${width(s.pace_s_per_km)}%"></i></td>
    </tr>`;
  }).join("");

  const panel = el(`
    <div class="detail">
      <div>
        <h4>逐公里分段</h4>
        <table class="splits">
          <thead><tr><th>公里</th><th>配速</th><th>心率</th><th>爬升</th><th></th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      ${hrCurveSvg(r)}
    </div>`);
  return panel;
}

function hrCurveSvg(r) {
  const pts = (r.hr_curve || []).map(([d, h]) => [Number(d), Number(h)]);
  if (pts.length < 5) return "";
  const W = 560, H = 120, padL = 34, padR = 8, padT = 10, padB = 20;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const dMax = pts[pts.length - 1][0] || 1;
  const hs = pts.map((p) => p[1]);
  const lo = Math.floor(Math.min(...hs) / 10) * 10, hi = Math.ceil(Math.max(...hs) / 10) * 10;
  const x = (d) => padL + (d / dMax) * plotW;
  const y = (h) => padT + plotH - ((h - lo) / Math.max(1, hi - lo)) * plotH;

  const line = pts.map((p, i) => `${i ? "L" : "M"}${x(p[0]).toFixed(1)},${y(p[1]).toFixed(1)}`).join("");
  let grid = "";
  for (let v = lo; v <= hi; v += Math.max(10, Math.round((hi - lo) / 3 / 10) * 10)) {
    grid += `<line class="grid-line" x1="${padL}" x2="${W - padR}" y1="${y(v)}" y2="${y(v)}"></line>
             <text class="tick" x="${padL - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  }
  let km = "";
  for (let d = 1000; d < dMax; d += 1000) {
    km += `<line class="grid-line" x1="${x(d)}" x2="${x(d)}" y1="${padT}" y2="${padT + plotH}"></line>
           <text class="tick" x="${x(d)}" y="${H - 6}" text-anchor="middle">${d / 1000}k</text>`;
  }
  return `<div>
    <h4>心率曲線 <span style="text-transform:none;letter-spacing:0">（橫軸為距離）</span></h4>
    <div class="chart-scroll">
      <svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="整趟心率變化">
        ${grid}${km}
        <path d="${line}" fill="none" stroke="var(--series-2)" stroke-width="2"
              stroke-linejoin="round" stroke-linecap="round"></path>
      </svg>
    </div>
  </div>`;
}

/* ---------------------------------------------------------------- 徽章 */
function badges({ quit, lifetimeKm, afterKm, after, runs }) {
  const days = (Date.now() - quit.getTime()) / 86400000;
  const longestAfter = after.reduce((a, r) => Math.max(a, KM(r.distance_m)), 0);
  const bestPace = after.filter((r) => r.distance_m >= 3000)
                        .reduce((a, r) => Math.min(a, r.pace_s_per_km ?? Infinity), Infinity);

  // 達成日：往回推算第一次跨過門檻的那一天
  const dayWhen = (t) => new Date(quit.getTime() + t * 86400000)
    .toLocaleDateString("zh-TW", { year: "numeric", month: "2-digit", day: "2-digit" });

  const kmWhen = (target) => {
    let acc = 0;
    for (const r of after) { acc += KM(r.distance_m); if (acc >= target) return r.day; }
    return null;
  };

  const groups = [
    {
      title: "戒菸",
      items: [
        { ico: "🌬", name: "撐過第一天", t: 1, v: days, u: "天",
          why: "血液裡的一氧化碳降回正常值，含氧量開始回升。", when: dayWhen(1) },
        { ico: "🍋", name: "三天", t: 3, v: days, u: "天",
          why: "尼古丁大致代謝完畢。這幾天最難熬，過了就是下坡路。", when: dayWhen(3) },
        { ico: "📅", name: "滿一週", t: 7, v: days, u: "天",
          why: "味覺和嗅覺開始回來，食物突然變得有味道。", when: dayWhen(7) },
        { ico: "🫁", name: "滿兩週", t: 14, v: days, u: "天",
          why: "肺部纖毛重新運作，循環改善，跑起來比較不喘。", when: dayWhen(14) },
        { ico: "🌙", name: "滿一個月", t: 30, v: days, u: "天",
          why: "肺功能明顯改善，多數人這時已經不太會突然想抽。", when: dayWhen(30) },
        { ico: "🍀", name: "滿三個月", t: 90, v: days, u: "天",
          why: "循環與肺功能的改善大致穩定下來。", when: dayWhen(90) },
        { ico: "🏔", name: "滿半年", t: 182, v: days, u: "天",
          why: "咳嗽與呼吸道感染的頻率通常已經明顯下降。", when: dayWhen(182) },
        { ico: "🎖", name: "滿一年", t: 365, v: days, u: "天",
          why: "心血管疾病的風險相較於持續吸菸大幅降低。", when: dayWhen(365) },
      ],
    },
    {
      title: "戒菸後的跑量",
      items: [10, 25, 50, 100, 200, 350, 500].map((t) => ({
        ico: "👟", name: `累積 ${t} 公里`, t, v: afterKm, u: "km",
        why: t <= 50 ? "從戒菸那天重新開始算的里程。"
           : t <= 200 ? "這些公里全部發生在沒有菸的日子裡。"
           : "一段用新的肺跑出來的距離。",
        when: kmWhen(t),
      })),
    },
    {
      title: "生涯里程",
      items: [4000, 4500, 5000, 6000].map((t) => ({
        ico: "🌍", name: `生涯 ${t.toLocaleString()} 公里`, t, v: lifetimeKm, u: "km",
        why: t === 4000 ? "十一年跑齡累積下來的距離。"
           : `離目前還有 ${n1(Math.max(0, t - lifetimeKm))} 公里。`,
        when: null,
      })),
    },
    {
      title: "單趟表現（戒菸後）",
      items: [
        { ico: "🔟", name: "單趟 10 公里", t: 10, v: longestAfter, u: "km", why: "一趟不停的兩位數。", when: null },
        { ico: "🥈", name: "半程馬拉松距離", t: 21.1, v: longestAfter, u: "km", why: "21.1 公里，一次跑完。", when: null },
        { ico: "🥇", name: "全程馬拉松距離", t: 42.2, v: longestAfter, u: "km", why: "42.195 公里。", when: null },
        { ico: "⚡", name: "配速破 6:00", t: 1, v: bestPace <= 360 ? 1 : 0, u: "flag",
          why: bestPace === Infinity ? "戒菸後還沒有 3 公里以上的紀錄。"
             : `目前最佳 ${pace(bestPace)}/km（3 公里以上）。`, when: null },
        { ico: "🔥", name: "配速破 5:30", t: 1, v: bestPace <= 330 ? 1 : 0, u: "flag",
          why: bestPace === Infinity ? "戒菸後還沒有 3 公里以上的紀錄。"
             : `目前最佳 ${pace(bestPace)}/km，還要再快 ${pace(Math.max(0, bestPace - 330))}。`, when: null },
      ],
    },
  ];

  const wrap = el('<section><h2>里程碑 <span class="sub">已達成的會亮起來</span></h2></section>');

  groups.forEach((g) => {
    wrap.append(el(`<p class="group-title">${g.title}</p>`));
    const grid = el('<div class="badges"></div>');
    g.items.forEach((b) => {
      const done = b.v >= b.t;
      const pct = Math.min(100, (b.v / b.t) * 100);
      grid.append(el(`
        <div class="badge ${done ? "done" : ""}">
          <div class="top"><span class="ico">${b.ico}</span><span class="name">${esc(b.name)}</span></div>
          <div class="why">${esc(b.why)}</div>
          ${done
            ? `<div class="when">${b.when ? `達成於 ${b.when}` : "已達成"}</div>`
            : b.u === "flag"
              ? `<div class="when">尚未達成</div>`
              : `<div class="bar"><i style="width:${pct}%"></i></div>
                 <div class="when">${b.u === "km"
                      ? `還差 ${n1(Math.max(0, b.t - b.v))} km`
                      : `還有 ${Math.ceil(b.t - b.v)} 天`}</div>`}
        </div>`));
    });
    wrap.append(grid);
  });
  return wrap;
}
</script>
